<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/{{ site_base_path }}{{ '/' if site_base_path else '' }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-icon">📚</span>
        <span class="brand-text">Biblioteca<span class="brand-accent">.personal</span></span>
      </a>

      <form class="search" action="{{ url_for('search') }}" method="get" role="search" autocomplete="off">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          id="search-input"
          name="q"
          type="search"
          placeholder="Busca un libro o autor…"
          aria-label="Buscar en la biblioteca"
        >
        <ul id="search-suggestions" class="search-suggestions" role="listbox" hidden></ul>
      </form>

      <div class="topbar-actions">
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">
          <span class="theme-icon-light">🌙</span>
          <span class="theme-icon-dark">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ app_name }}</span>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
